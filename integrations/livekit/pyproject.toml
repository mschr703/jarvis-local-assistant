[project]
name = "jarvis-livekit-pilot"
version = "0.1.0"
description = "Isolated local German voice-session pilot for Jarvis G02"
requires-python = ">=3.13,<3.14"
dependencies = [
  "livekit-agents[openai,silero]==1.8.10",
  "faster-whisper==1.2.1",
  "av>=14,<19",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
